name: DIGISEC Brand Asset Check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow

      - name: Validate DIGISEC brand assets
        run: python scripts/validate_assets.py
